# Typecheck, test, and changeset checks. Uploaded for every build.
steps:
  # Linux only, by choice: the cluster does have macOS queues, but the CLI is
  # developed on macOS daily, so a matrix would mostly re-test the covered
  # platform. Platform differences ride on unit tests and local dev instead.
  - label: ':test_tube: test (linux, node 24)'
    key: test
    command: .buildkite/steps/test.sh
    agents:
      queue: linux-small

  # Guards the release flow: a behaviour change merged without a changeset
  # would otherwise ship silently under the previous version number.
  #
  # Runs the vendored copy of the changesets plugin, which is the same code as
  # JakeGinnivan/changesets-buildkite-plugin. It is vendored rather than
  # referenced by tag so this pipeline proves it on a real build before there is
  # a tag to pin -- and while vendored, the plugin is always at this repo's own
  # commit, so there is no clone to go stale.
  #
  # The plugin deliberately knows nothing about mise or pnpm; installing the
  # toolchain is the consumer's job, which is what the command is for. The
  # plugin's own hook runs after it.
  - label: ':memo: changeset present'
    key: changeset
    command: .buildkite/steps/install.sh
    plugins:
      - ./.buildkite/plugins/changesets:
          mode: check
    agents:
      queue: linux-small

  # A single stable status for a branch protection rule to require. Step labels
  # encode the platform and node version, so requiring those directly would mean
  # every such change silently renames a required check. This name is fixed.
  #
  # depends_on (not a `wait`) so the dependency is explicit and this step still
  # reports rather than being skipped when an upstream step fails.
  - label: ':white_check_mark: CI'
    key: ci
    command: 'echo "All required steps succeeded."'
    depends_on:
      - test
      - changeset
    agents:
      queue: linux-small
