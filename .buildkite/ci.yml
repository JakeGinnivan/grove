# Typecheck, test, and changeset checks. Uploaded for every build.
steps:
  # The CLI drives real git, so it is tested on each platform it runs on.
  # Ported from the GitHub Actions matrix; windows-latest is dropped because
  # there is no Windows agent queue.
  - group: ':test_tube: test'
    key: test
    steps:
      - label: 'test ({{matrix}}, node 24)'
        command: .buildkite/test.sh
        agents:
          queue: '{{matrix}}'
        matrix:
          - linux
          - macos

  # Guards the release flow: a behaviour change merged without a changeset
  # would otherwise ship silently under the previous version number.
  - label: ':memo: changeset present'
    key: changeset
    command: .buildkite/changeset-check.sh
    agents:
      queue: linux

  # A single stable status for a branch protection rule to require. The matrix
  # step labels encode the platform, so requiring those directly would mean
  # every matrix change silently renames a required check. This name is fixed.
  #
  # depends_on (not a `wait`) so the dependency is explicit and this step still
  # reports rather than being skipped when an upstream step fails.
  - label: ':white_check_mark: CI'
    key: ci
    command: 'echo "All required steps succeeded."'
    depends_on:
      - test
      - changeset
    agents:
      queue: linux
