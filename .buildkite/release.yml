# Uploaded only for builds on the default branch that are not pull requests.
# See .buildkite/steps/upload.sh for that decision.
steps:
  # Never release a commit whose tests have not passed.
  #
  # This depends_on replaces a `wait: ~`, which did not work: a wait is a
  # barrier against the steps already present in the same uploaded pipeline,
  # and this file is uploaded separately from ci.yml. The release step had
  # nothing above it to wait for, so it ran concurrently with the tests --
  # build 11 started it one second before `test` and finished it 35s before
  # the tests did. depends_on resolves by key across both uploads instead.
  - label: ':rocket: version or publish'
    command: .buildkite/steps/release.sh
    # `ci` already gates on both test and changeset; see ci.yml.
    depends_on: ci
    # Two releases at once would race on the version PR and the registry.
    concurrency: 1
    concurrency_group: 'grove/release'
    agents:
      queue: linux-small
