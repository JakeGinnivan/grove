name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only ever reads. The release workflow asks for more, per job.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref, except on main
# where every commit's result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 24 is the floor declared in engines and the current LTS. The CLI
        # drives real git across three platforms, so all three are tested.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm (its native per-platform binary, no Node.js needed to
      # bootstrap), the runtime, and the dependencies in one step. The pnpm
      # version comes from `packageManager` in package.json. `pnpm install`
      # runs automatically and defaults to --frozen-lockfile under CI.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      # Integration tests shell out to git and read its config, so give the
      # runner an identity rather than letting each test invent one.
      - name: Configure git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: pnpm typecheck

      # Builds first via the vitest globalSetup, then runs against the bundle.
      - run: pnpm test

  # Guards the release flow: a behaviour change merged without a changeset
  # would otherwise ship silently under the previous version number.
  changeset:
    name: changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # This job only reads the diff, so it needs neither pnpm nor Node.
      - name: Check for a changeset
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The version PR itself consumes changesets rather than adding one.
          if git diff --name-only "$BASE" "$HEAD" | grep -q '^\.changeset/.*\.md$'; then
            echo "Changeset found."
            exit 0
          fi
          # Nothing shipped means nothing to describe.
          if ! git diff --name-only "$BASE" "$HEAD" | grep -qE '^src/|^package\.json$'; then
            echo "No shippable changes; no changeset needed."
            exit 0
          fi
          echo "::error::This PR changes src/ but adds no changeset."
          echo "Run \`pnpm changeset\` and commit the result, or add one via the"
          echo "changeset bot if the change is not user-visible."
          exit 1
