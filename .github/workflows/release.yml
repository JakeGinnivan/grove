name: Release

on:
  push:
    branches: [main]

# Nothing is granted by default; the release job asks for exactly what it needs.
permissions: {}

# Two releases running at once would race on the version PR and the registry.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs pnpm (its native per-platform binary), Node, and the
      # dependencies in one step; the pnpm version comes from
      # `packageManager` in package.json.
      #
      # Deliberately no registry auth is configured here: writing an auth line
      # into .npmrc makes npm skip the OIDC exchange and publish as anonymous —
      # surfacing as a bare 404. https://github.com/changesets/changesets/issues/1914
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships a new enough npm
      # today, but the bundled version drifts; pinning it here keeps a runner
      # image update from turning into a mystery 404 at publish time.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # No NPM_TOKEN anywhere: authentication is the OIDC exchange, and
      # provenance is automatic because of it. GITHUB_TOKEN is only for
      # opening the version PR and reading PR titles for the changelog.
      - name: Create version PR or publish
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
