name: Release

on:
  push:
    branches: [main]

# Nothing is granted by default; the release job asks for exactly what it needs.
permissions: {}

# Two releases running at once would race on the version PR and the registry.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push tags
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      # The version PR this workflow opens is authored by github-actions[bot],
      # so its CI runs are created in an approval-required state and need a
      # click before they start (GitHub's loop prevention, relaxed in June 2026
      # from "no runs at all"). No status check is required to merge, so that
      # click is optional — the release itself is never blocked by it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Installs pnpm (its native per-platform binary), Node, and the
      # dependencies in one step; the pnpm version comes from
      # `packageManager` in package.json.
      #
      # Deliberately no registry auth is configured here: writing an auth line
      # into .npmrc makes npm skip the OIDC exchange and publish as anonymous —
      # surfacing as a bare 404. https://github.com/changesets/changesets/issues/1914
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      # Changesets detects pnpm and runs `pnpm publish`, so pnpm — not npm — is
      # what performs the OIDC exchange, at the version from `packageManager`
      # above. Keep that at 11.1.3 or newer: 11.0.x–11.1.2 sent unresolved
      # .npmrc placeholders as a bearer token and 404'd instead of falling back
      # to OIDC (pnpm/pnpm#11526). npm only needs to be on PATH at any version,
      # for the unauthenticated `npm info` published-version check.
      #
      # No NPM_TOKEN anywhere: authentication is the OIDC exchange, and
      # provenance is automatic because of it — no --provenance flag needed
      # (docs.npmjs.com/generating-provenance-statements). It needs the repo and
      # the package to both be public and `repository.url` to match this repo
      # case-sensitively; when it cannot, pnpm only warns ("Skipped setting
      # provenance") and publishes without it, so check the log after a release.
      #
      # GITHUB_TOKEN is only for opening and pushing the version PR — the
      # changelog is generated from commits by @changesets/changelog-git and
      # needs no API access.
      - name: Create version PR or publish
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          # changesets/action reads this input, not a GITHUB_TOKEN env var.
          github-token: ${{ secrets.GITHUB_TOKEN }}
